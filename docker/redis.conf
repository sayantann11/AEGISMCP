# Example Redis 7 TLS-only configuration. Mount a reviewed ACL file and TLS
# certificates at these paths; never publish the container port to the host.
bind 0.0.0.0
protected-mode yes
port 0
tls-port 6379
tls-cert-file /run/redis/tls/server.crt
tls-key-file /run/redis/tls/server.key
tls-ca-cert-file /run/redis/tls/ca.crt
tls-auth-clients yes
aclfile /run/redis/acl/users.acl
save ""
appendonly no
maxmemory 256mb
maxmemory-policy noeviction
timeout 60
tcp-keepalive 60
